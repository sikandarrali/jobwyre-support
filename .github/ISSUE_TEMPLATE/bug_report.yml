name: 🐛 Bug report
description: Something in jobwyre isn't working the way it should.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this — before filing, please
        [search existing issues](https://github.com/sikandarrali/jobwyre-support/issues) to
        make sure it isn't already reported.

  - type: dropdown
    id: plan
    attributes:
      label: Plan
      description: Which jobwyre plan are you on?
      options:
        - Free
        - Pro
        - API
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
      placeholder: When I click "Add job", nothing happens and the dialog doesn't open.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we see this ourselves?
      placeholder: |
        1. Go to the dashboard
        2. Click '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recordings
      description: Drag and drop images/videos here if you have any — very helpful for anything visual.
    validations:
      required: false

  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Desktop
        - Mobile
        - Tablet
    validations:
      required: true

  - type: input
    id: browser
    attributes:
      label: Browser (and version, if known)
      placeholder: Chrome 128, Safari 17, etc.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Anything else?
      description: Additional context, error messages, or things you've already tried.
    validations:
      required: false
